const regionCounts={};function fallback(s){const center=regionCenters[s.region]||[37.566,126.978];const idx=regionCounts[s.region]||0;regionCounts[s.region]=idx+1;const angle=idx*2.39996;const distance=0.0018*Math.sqrt(idx+1);return [center[0]+distance*Math.cos(angle),center[1]+distance*Math.sin(angle)]}
const allBounds=[];
function markerFor(s){const exact=cached[s.address]&&Number.isFinite(cached[s.address].lat)&&Number.isFinite(cached[s.address].lon);const coords=exact?[cached[s.address].lat,cached[s.address].lon]:fallback(s);const exStatus=exhibitionStatus(s.name);const pinColor=exStatus==='inactive'?'#c7cbd0':exStatus==='unknown'?'#d8ba83':'#b83847';const mark=L.circleMarker(coords,{radius:5.5,color:'#ffffff',fillColor:pinColor,weight:2,fillOpacity:1}).addTo(map);mark.bindTooltip(s.name,{permanent:true,direction:'right',offset:[7,0],className:'permalabel',opacity:.96}).openTooltip();const popup=document.createElement('div');const strong=document.createElement('strong');strong.textContent=s.name;popup.append(strong,document.createElement('br'),document.createTextNode(s.address||'주소 미등록'),document.createElement('br'));const verification=document.createElement('span');verification.textContent=exact?'주소 검색으로 추정된 좌표':'임시 지역 위치 · 정확한 위치 확인 중';popup.append(verification);if(s.address){popup.append(document.createElement('br'));const link=document.createElement('a');link.textContent='지도에서 주소 검색';link.href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.address);link.target='_blank';link.rel='noopener noreferrer';popup.append(link)}mark.bindPopup(popup);markerByName.set(s.name,{mark,s,verification,exact:!!exact});if(s.region!=='서울 외')allBounds.push(coords)}
spaces.forEach(markerFor);
map.setView([37.560,126.982],10);
function render(){const term=qs('q').value.trim().toLowerCase(),region=qs('r').value;const results=spaces.filter(s=>(!region||s.region===region)&&(!term||(s.name+' '+s.address).toLowerCase().includes(term)));qs('status').textContent='전체 '+spaces.length+'곳 표시 중 · 주소 기반 위치 '+[...markerByName.values()].filter(x=>x.exact).length+'곳 · 임시 위치는 상세정보에 표시';const list=qs('list');list.replaceChildren();for(const s of results){const item=document.createElement('div');item.className='entry';item.textContent=s.rank+'. '+s.name;const sub=document.createElement('small');sub.textContent=s.address||'주소 확인 필요';item.append(sub);item.onclick=()=>map.setView(markerByName.get(s.name).mark.getLatLng(),15);list.append(item)}}
qs('q').oninput=render;qs('r').onchange=render;render();
function updatePosition(s,p){const item=markerByName.get(s.name);if(!item)return;item.mark.setLatLng([p.lat,p.lon]);item.mark.setStyle({color:'#fff',fillColor:exhibitionStatus(s.name)==='inactive'?'#c7cbd0':exhibitionStatus(s.name)==='unknown'?'#d8ba83':'#b83847'});item.verification.textContent='주소 검색으로 추정된 좌표';item.exact=true;cached[s.address]=p;try{localStorage.setItem(cacheKey,JSON.stringify(cached))}catch{}render()}
async function loadPrecomputed(){try{const response=await fetch('./coordinates.json',{cache:'no-cache'});if(!response.ok)return;const json=await response.json();for(const s of spaces){const p=json[s.address];if(p&&Number.isFinite(p.lat)&&Number.isFinite(p.lon))updatePosition(s,p)}}catch(error){console.log('No precomputed location data:',error)}}
async function autoLocate(){await loadPrecomputed();const missing=spaces.filter(s=>s.address&&!cached[s.address]);for(const s of missing){try{const u='https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=kr&q='+encodeURIComponent(s.address);const response=await fetch(u);if(response.status===403||response.status===429){console.warn('Geocoding provider rate limited');break}if(response.ok){const rows=await response.json();if(rows.length){const lat=Number(rows[0].lat),lon=Number(rows[0].lon);if(Number.isFinite(lat)&&Number.isFinite(lon))updatePosition(s,{lat,lon})}}}catch(e){console.warn('Unable to geocode',s.name,e)}await new Promise(resolve=>setTimeout(resolve,1200))}}
autoLocate();

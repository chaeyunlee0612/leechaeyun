name: Preload Art Map Coordinates
on:
  workflow_dispatch:
  push:
    paths:
      - "art-map/index.html"
      - "art-map/geocode.py"
permissions:
  contents: write
jobs:
  geocode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python art-map/geocode.py
      - name: Commit coordinates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art-map/coordinates.json
          if ! git diff --cached --quiet; then
            git commit -m "Preload geocoded art space locations"
            git push
          fi
